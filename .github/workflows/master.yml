name: Periodic Repository Maintenance

on:
  schedule:
    # 02:17 UTC = 09:17 WIB
    # Minggu, Senin, Selasa, Kamis
    # Jeda: 1 hari → 1 hari → 2 hari → 3 hari
    - cron: '17 2 * * 0,1,2,4'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "SyukurGit"
          git config user.email "220705058@student.ar-raniry.ac.id"

      - name: Run repository maintenance
        shell: bash
        run: |
          echo "Running scheduled repository maintenance..."

          # Jalankan maintenance nyata di sini.
          #
          # Contoh:
          # python scripts/update_project_index.py
          # npm run generate:metadata
          # bash scripts/update-readme-data.sh
          #
          # Kalau script belum ada, workflow tetap aman
          # dan tidak akan membuat commit kosong.

          if [ -f "scripts/update-readme-data.sh" ]; then
            bash scripts/update-readme-data.sh
          fi

          if [ -f "scripts/update_project_index.py" ]; then
            python scripts/update_project_index.py
          fi

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Repository changes detected."
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git commit -m "chore: periodic repository maintenance"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push origin HEAD
